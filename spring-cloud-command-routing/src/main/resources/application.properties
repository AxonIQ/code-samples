spring.application.name=spring-cloud-command-routing
server.port=${PORT:8080}

# Every instance registers with Consul under the same service name, and so joins the same cluster.
# The instance id has to be unique per instance, and is what the replies name.
spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
spring.cloud.consul.discovery.instance-id=${spring.application.name}-${server.port}
# This sample has no actuator, so there is no health endpoint for Consul to check.
spring.cloud.consul.discovery.register-health-check=false
